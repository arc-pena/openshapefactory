<title>Web BIM</title>
<meta name="description" content="A browser BIM authoring tool on an OCAF-style parametric document: walls, joins, openings, spaces, views, sheets and exact PDF/DXF output.">
<style>
:root {
  --ground: #D9DCE1; --panel: #FFFFFF; --panel-2: #F3F4F6; --panel-3: #E9EBEE; --ink: #1B1F24; --ink-2: #454C57; --ink-3: #7A828E;
  --rule: #C9CED6; --rule-2: #E3E6EA; --accent: #0F6CBD; --accent-2: #DCEBFA; --accent-ink: #FFFFFF;
  --error: #B3261E; --error-bg: #FBE9E7; --note: #8A5A00; --note-bg: #FFF4DB; --ok: #1E7F4F; --ok-bg: #E4F4EA;
  --chrome: #EEF0F3; --chrome-2: #E2E5E9; --title: #2B3A4E; --title-ink: #E9EEF5; --file: #1E5AA8; --context: #2E8B3E; --context-bg: #E6F3E8;
  --canvas: #FFFFFF; --canvas-3d: linear-gradient(#EAEDF1, #FFFFFF 70%); --paper-edge: rgba(23, 32, 44, .18); --shadow: 0 1px 2px rgba(23,32,44,.1), 0 4px 14px rgba(23,32,44,.12);
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; --cond: var(--sans);
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --left-w: 300px; --qat-h: 32px; --rtab-h: 27px; --rpanel-h: 92px; --opt-h: 30px; --status-h: 24px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --ground: #15191F; --panel: #1E232A; --panel-2: #252B33; --panel-3: #2C333C; --ink: #E6E9EE; --ink-2: #AEB6C2; --ink-3: #7E8896;
  --rule: #353D48; --rule-2: #2A313B; --accent: #5B9BF0; --accent-2: #1C2B40; --accent-ink: #0B1016;
  --error: #F2867D; --error-bg: #3A1D1B; --note: #E6B758; --note-bg: #33290F; --ok: #6FCF9C; --ok-bg: #16301F;
  --chrome: #262B33; --chrome-2: #1F242B; --title: #11151A; --title-ink: #D5DCE6; --file: #2F6FC4; --context: #4CAF62; --context-bg: #1B2E20;
  --canvas: #20252C; --canvas-3d: linear-gradient(#2A3038, #1B1F25 70%); --paper-edge: rgba(0,0,0,.5); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #15191F; --panel: #1E232A; --panel-2: #252B33; --panel-3: #2C333C; --ink: #E6E9EE; --ink-2: #AEB6C2; --ink-3: #7E8896;
  --rule: #353D48; --rule-2: #2A313B; --accent: #5B9BF0; --accent-2: #1C2B40; --accent-ink: #0B1016;
  --error: #F2867D; --error-bg: #3A1D1B; --note: #E6B758; --note-bg: #33290F; --ok: #6FCF9C; --ok-bg: #16301F;
  --chrome: #262B33; --chrome-2: #1F242B; --title: #11151A; --title-ink: #D5DCE6; --file: #2F6FC4; --context: #4CAF62; --context-bg: #1B2E20;
  --canvas: #20252C; --canvas-3d: linear-gradient(#2A3038, #1B1F25 70%); --paper-edge: rgba(0,0,0,.5); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 12.5px/1.35 var(--sans); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--ink-3); }
.grow { flex: 1; min-width: 0; }
.app { display: grid; height: 100%; grid-template-columns: var(--left-w) 1fr;
  grid-template-rows: var(--qat-h) auto var(--opt-h) 1fr var(--status-h);
  grid-template-areas: "qat qat" "ribbon ribbon" "options options" "left main" "status status"; }
/* quick access toolbar = the title bar */
.qat { grid-area: qat; display: flex; align-items: center; gap: 1px; padding: 0 6px; background: var(--title); color: var(--title-ink); min-width: 0; }
.qat .logo { width: 22px; height: 22px; display: grid; place-items: center; background: var(--file); color: #fff; font-weight: 700; border-radius: 3px; margin-right: 6px; flex: none; }
.qbtn { width: 28px; height: 26px; display: grid; place-items: center; border: 0; background: none; color: inherit; border-radius: 3px; padding: 0; flex: none; }
.qbtn:hover { background: rgba(255,255,255,.14); }
.qbtn[disabled] { opacity: .35; cursor: default; background: none; }
.qsep { width: 1px; height: 16px; background: rgba(255,255,255,.22); margin: 0 4px; flex: none; }
.qtitle { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; min-width: 0; padding: 0 8px; }
.qtitle b { font-weight: 600; }
/* ribbon */
.ribbon { grid-area: ribbon; background: var(--chrome); border-bottom: 1px solid var(--rule); min-width: 0; }
.rtabs { display: flex; align-items: flex-end; height: var(--rtab-h); background: var(--chrome-2); padding: 0 4px; gap: 1px; overflow-x: auto; scrollbar-width: none; }
.rtab { height: 24px; padding: 0 12px; border: 1px solid transparent; border-bottom: 0; background: none; color: var(--ink-2); white-space: nowrap; border-radius: 3px 3px 0 0; }
.rtab:hover { color: var(--ink); background: rgba(127,127,127,.12); }
.rtab[aria-selected="true"] { background: var(--chrome); border-color: var(--rule); color: var(--ink); font-weight: 600; margin-bottom: -1px; height: 25px; }
.rtab.file { background: var(--file); color: #fff; font-weight: 600; border-radius: 3px 3px 0 0; margin-right: 4px; padding: 0 16px; }
.rtab.file:hover { filter: brightness(1.1); }
.rtab.context { color: var(--context); font-weight: 600; background: var(--context-bg); border-color: var(--context); border-top-width: 3px; }
.rtab.context[aria-selected="true"] { background: var(--context-bg); }
.rtab.mini { padding: 0 8px; color: var(--ink-3); }
.ribbon.collapsed .rpanels { display: none; }
.rpanels { display: flex; height: var(--rpanel-h); padding: 3px 3px 0; gap: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rpanel { display: flex; flex-direction: column; border-right: 1px solid var(--rule); padding: 0 3px; flex: none; }
.rpbody { flex: 1; display: flex; align-items: stretch; gap: 1px; }
.rptitle { height: 18px; text-align: center; font-size: 11px; color: var(--ink-3); border-top: 1px solid var(--rule-2); line-height: 17px; white-space: nowrap; padding: 0 4px; }
.rbig { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; min-width: 52px; max-width: 72px; padding: 4px 4px 2px; border: 1px solid transparent; background: none; border-radius: 3px; font-size: 11.5px; line-height: 1.15; color: var(--ink); }
.rbig span { text-align: center; overflow-wrap: normal; hyphens: none; }
.rbig svg { color: var(--accent); flex: none; }
.rsmallcol { display: flex; flex-direction: column; gap: 1px; justify-content: flex-start; padding-top: 2px; }
.rsmall { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px 0 3px; border: 1px solid transparent; background: none; border-radius: 3px; white-space: nowrap; font-size: 12px; color: var(--ink); }
.rsmall svg { color: var(--accent); flex: none; }
.rbig:hover, .rsmall:hover { background: var(--accent-2); border-color: #9CC3F0; }
.rbig[aria-pressed="true"], .rsmall[aria-pressed="true"] { background: #C4DDF7; border-color: var(--accent); }
/* options bar */
.options { grid-area: options; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--panel-2); border-bottom: 1px solid var(--rule); white-space: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.options .otitle { font-weight: 600; color: var(--ink); padding-right: 12px; border-right: 1px solid var(--rule); }
.options label { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); }
.options select, .options input[type=text] { height: 22px; border: 1px solid var(--rule); border-radius: 2px; background: var(--panel); padding: 0 4px; }
/* palettes */
.left { grid-area: left; display: grid; grid-template-rows: var(--split, 55%) 5px 1fr; background: var(--chrome); border-right: 1px solid var(--rule); min-height: 0; min-width: 0; }
body.hide-props .left { grid-template-rows: 0 0 1fr; }
body.hide-props .palette.props, body.hide-props .psplit { display: none; }
.palette { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--rule); margin: 3px 3px 0; }
.palette.browser { margin-bottom: 3px; }
.palette > header { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 8px; background: var(--chrome-2); border-bottom: 1px solid var(--rule); font-weight: 600; font-size: 12px; flex: none; white-space: nowrap; overflow: hidden; }
.palette > header > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pclose { border: 0; background: none; color: var(--ink-3); width: 20px; height: 20px; padding: 0; border-radius: 2px; }
.pclose:hover { background: var(--error-bg); color: var(--error); }
.ptabs { display: flex; gap: 1px; }
.ptabs button { border: 1px solid var(--rule); background: var(--panel); height: 18px; padding: 0 6px; font-size: 11px; font-weight: 400; border-radius: 2px; }
.ptabs button[aria-pressed="true"] { background: var(--accent-2); border-color: var(--accent); color: var(--accent); }
.pbody { flex: 1; overflow: auto; min-height: 0; }
.psplit { cursor: row-resize; background: transparent; touch-action: none; }
.psplit:hover { background: var(--accent-2); }
/* main: document tabs, view, view control bar */
.main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground); }
.dtabs { display: flex; gap: 1px; height: 26px; align-items: flex-end; padding: 0 4px; background: var(--chrome-2); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; flex: none; }
.dtab { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 4px 0 9px; border: 1px solid var(--rule); border-bottom: 0; background: var(--chrome); color: var(--ink-2); white-space: nowrap; font-size: 12px; border-radius: 3px 3px 0 0; }
.dtab svg { color: var(--accent); }
.dtab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; height: 25px; margin-bottom: -1px; }
.dtab .x { opacity: .45; font-size: 10px; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 2px; }
.dtab .x:hover { opacity: 1; background: var(--error-bg); color: var(--error); }
.viewhost { position: relative; flex: 1; overflow: hidden; background: var(--canvas); min-height: 0; }
.vcb { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; background: var(--chrome); border-top: 1px solid var(--rule); white-space: nowrap; overflow-x: auto; scrollbar-width: none; flex: none; }
.vcb select { height: 22px; border: 1px solid var(--rule); background: var(--panel); border-radius: 2px; padding: 0 3px; font-size: 12px; }
.vcb .vscale { font-weight: 600; }
.vbtn { width: 24px; height: 22px; display: grid; place-items: center; border: 1px solid transparent; background: none; border-radius: 2px; padding: 0; color: var(--ink-2); flex: none; }
.vbtn:hover { background: var(--accent-2); border-color: #9CC3F0; }
.vbtn[aria-pressed="true"] { background: #C4DDF7; border-color: var(--accent); color: var(--accent); }
/* status bar */
.status { grid-area: status; display: flex; align-items: center; gap: 12px; padding: 0 8px; background: var(--chrome-2); border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-2); min-width: 0; overflow: hidden; white-space: nowrap; }
.status .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status .msg.error { color: var(--error); } .status .msg.note { color: var(--ink-2); } .status .msg.ok { color: var(--ok); }
.status #stats[data-keys]:not([data-keys=""])::before { content: attr(data-keys); font-weight: 700; color: var(--accent); margin-right: 8px; }
/* context / file menu */
.cmenu { position: fixed; z-index: 60; min-width: 220px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 3px; border-radius: 3px; }
.cmenu button { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 2px; white-space: nowrap; }
.cmenu button:hover { background: var(--accent-2); }
.cmenu button[disabled] { opacity: .4; }
.cmenu svg { color: var(--accent); }
.cmenu .ck { font: 11px var(--mono); color: var(--ink-3); }
.cmenu .csep { height: 1px; background: var(--rule-2); margin: 3px 4px; }
/* ViewCube + navigation bar */
.viewcube { position: absolute; right: 10px; top: 8px; width: 116px; height: 116px; z-index: 6; }
.viewcube canvas { display: block; }
.vc-home { position: absolute; left: 0; top: 0; width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-2); border-radius: 3px; padding: 0; z-index: 1; }
.vc-home:hover { background: var(--accent-2); color: var(--accent); }
.navbar { position: absolute; right: 50px; top: 132px; display: flex; flex-direction: column; gap: 1px; padding: 2px; background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; box-shadow: var(--shadow); z-index: 6; }
.navbar button { width: 26px; height: 26px; display: grid; place-items: center; border: 0; background: none; border-radius: 2px; padding: 0; color: var(--ink-2); }
.navbar button:hover { background: var(--accent-2); color: var(--accent); }
.selbox { position: absolute; z-index: 5; pointer-events: none; border: 1px solid #1d6fd8; background: rgba(29,111,216,.08); }
.selbox.crossing { border-style: dashed; border-color: #2e8b3e; background: rgba(46,139,62,.08); }
.three { position: absolute; inset: 0; background: var(--canvas-3d); }
/* shared bits */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border: 1px solid var(--rule); background: var(--panel); border-radius: 2px; white-space: nowrap; }
.btn:hover { background: var(--accent-2); border-color: #9CC3F0; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.small { height: 22px; padding: 0 8px; font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); height: 22px; padding: 0 8px; border-right: 1px solid var(--rule); font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-2); color: var(--accent); font-weight: 600; }
.snaps { display: flex; gap: 1px; }
.snaps button { border: 1px solid transparent; background: none; font: 500 11px var(--mono); padding: 1px 4px; border-radius: 2px; color: var(--ink-3); }
.snaps button[aria-pressed="true"] { color: var(--accent); border-color: #9CC3F0; background: var(--accent-2); }
/* tree */
.tree { list-style: none; margin: 0; padding: 4px 0 12px; }
.tree ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
.tree .row { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; cursor: default; border-radius: 4px; margin: 0 6px; min-height: 26px; }
.tree .row:hover { background: var(--panel-2); }
.tree .row.sel { background: var(--accent-2); }
.tree .row.active .lab { font-weight: 700; }
.tree .row[draggable=true] { cursor: grab; }
.tree .row svg { color: var(--accent); flex: none; }
.tree .row .fold { width: 16px; text-align: center; color: var(--ink-3); border: 0; background: none; padding: 0; font-size: 11px; }
.tree .row .lab { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tree .row .id { font: 11px var(--mono); color: var(--ink-3); }
.tree .head { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.tree .count { font: 11px var(--mono); color: var(--ink-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.err { background: var(--error); } .dot.note { background: var(--note); } .dot.ok { background: var(--ok); opacity: .5; }
.eye { border: 0; background: none; padding: 0 2px; color: var(--ink-3); font-size: 12px; }
.eye[aria-pressed="false"] { opacity: .35; }
.search { margin: 8px 10px 4px; display: flex; }
.search input { flex: 1; height: 28px; border: 1px solid var(--rule); border-radius: 5px; padding: 0 8px; background: var(--panel-2); min-width: 0; }
/* property panel */
.pp { padding: 0 0 20px; }
.pp-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--rule-2); display: grid; gap: 6px; }
.pp-head .title { display: flex; gap: 8px; align-items: center; }
.pp-head input.name { font: 600 15px var(--sans); border: 1px solid transparent; background: none; padding: 2px 4px; margin-left: -5px; border-radius: 4px; min-width: 0; flex: 1; }
.pp-head input.name:hover, .pp-head input.name:focus { border-color: var(--rule); background: var(--panel-2); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font: 500 11px var(--mono); background: var(--panel-3); color: var(--ink-2); white-space: nowrap; }
.chip.accent { background: var(--accent-2); color: var(--accent); }
.banner { margin: 8px 14px 0; padding: 7px 10px; border-radius: 5px; font-size: 12.5px; overflow-wrap: anywhere; }
.banner.error { background: var(--error-bg); color: var(--error); } .banner.note { background: var(--note-bg); color: var(--note); } .banner.ok { background: var(--ok-bg); color: var(--ok); }
.typebar { display: flex; gap: 6px; align-items: center; }
.typebar select { flex: 1; min-width: 0; }
.grp { border-bottom: 1px solid var(--rule-2); }
.grp > summary { list-style: none; cursor: pointer; padding: 9px 14px 7px; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::after { content: "–"; color: var(--ink-3); }
.grp:not([open]) > summary::after { content: "+"; }
.prow { display: grid; grid-template-columns: 38% 1fr; gap: 8px; padding: 4px 14px; align-items: start; }
.prow > label { padding-top: 5px; color: var(--ink-2); overflow-wrap: anywhere; }
.prow .val { display: grid; gap: 2px; min-width: 0; }
.prow input[type=text], .prow select, .prow textarea { width: 100%; height: 28px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 7px; background: var(--panel); min-width: 0; }
.prow textarea { height: 64px; padding: 5px 7px; font: 11.5px var(--mono); resize: vertical; }
.prow input.bound { font-family: var(--mono); font-size: 12px; color: var(--accent); background: var(--accent-2); border-color: transparent; }
.prow .under { font: 11px var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.prow .under.err { color: var(--error); }
.prow .ro { padding-top: 5px; overflow-wrap: anywhere; }
.prow .origin { font-size: 11px; color: var(--ink-3); }
.prow .line { display: flex; gap: 4px; align-items: center; min-width: 0; }
.prow .line > :first-child { flex: 1; min-width: 0; }
.iconbtn { border: 1px solid var(--rule); background: var(--panel); width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; flex: none; color: var(--ink-2); padding: 0; }
.iconbtn:hover { background: var(--panel-2); color: var(--accent); }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.empty { padding: 26px 18px; color: var(--ink-3); line-height: 1.55; }
.empty h3 { margin: 0 0 6px; font: 600 14px var(--sans); color: var(--ink-2); }
/* floating chrome over the canvas */
.viewbar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 150px); }
.viewbar .card { flex-wrap: wrap; }
.viewbar .card { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); font-size: 12px; }
.hud { position: absolute; pointer-events: none; z-index: 8; background: var(--ink); color: var(--panel); font: 500 12px var(--mono); padding: 3px 7px; border-radius: 4px; white-space: nowrap; transform: translate(14px, 14px); }
.hud input { pointer-events: auto; width: 90px; background: var(--panel); color: var(--ink); border: 0; border-radius: 3px; font: 12px var(--mono); padding: 1px 4px; }
.snapglyph { position: absolute; pointer-events: none; z-index: 7; width: 12px; height: 12px; border: 2px solid #E8591A; transform: translate(-6px, -6px); }
.snapglyph.mid { transform: translate(-6px, -6px) rotate(45deg); }
.snapglyph.int { border-radius: 0; background: linear-gradient(45deg, transparent 45%, #E8591A 45%, #E8591A 55%, transparent 55%); }
.snapglyph.perp { border-width: 0 0 2px 2px; }
.snapglyph.near { border-radius: 50%; }
.snaplabel { position: absolute; pointer-events: none; z-index: 7; font: 600 10.5px var(--mono); color: #E8591A; transform: translate(10px, -18px); }
.handle { position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; background: #fff; border: 2px solid var(--accent); border-radius: 2px; z-index: 6; touch-action: none; cursor: grab; }
.handle.move { border-radius: 50%; width: 13px; height: 13px; margin: -7px 0 0 -7px; background: var(--accent); }
.handle.axis { background: var(--accent); transform: rotate(45deg); }
.handle:hover { transform: scale(1.3); }
.tdim { position: absolute; z-index: 6; display: flex; gap: 2px; align-items: center; transform: translate(-50%, -50%); }
.tdim button { border: 1px solid #1d6fd8; background: #fff; color: #1d6fd8; font: 600 11px var(--mono); padding: 1px 5px; border-radius: 3px; }
.tdim button.lock { padding: 1px 3px; }
.tdim input { width: 72px; font: 600 11px var(--mono); border: 1px solid #1d6fd8; border-radius: 3px; padding: 1px 4px; }
.popover { position: absolute; z-index: 20; min-width: 220px; max-width: 320px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; }
.popover h4 { margin: 2px 6px 6px; font: 600 12px var(--sans); color: var(--ink-2); }
.popover button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 4px; overflow-wrap: anywhere; }

.canvas2d { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.stale { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--error-bg); color: var(--error); padding: 6px 12px; border-radius: 6px; font-size: 12.5px; z-index: 5; box-shadow: var(--shadow); }
.progress { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; width: 160px; }

.sheetpane { position: absolute; inset: 0; overflow: auto; padding: 24px; }

.doccard header { padding: 16px 18px 10px; border-bottom: 1px solid var(--rule-2); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.doccard header h2 { margin: 0; font: 600 18px var(--cond); letter-spacing: .01em; }
.tablewrap { overflow-x: auto; }

.result .nm { font-weight: 500; }

.result .kv span:nth-child(odd) { color: var(--ink-3); }

.summary { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 18px; }

.dialog header { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }

.gnode rect.b { fill: var(--panel); stroke: var(--rule); }
.gnode.sel rect.b { stroke: var(--accent); stroke-width: 2; }
.gnode.err rect.b { stroke: var(--error); }

.gnode text.p { font: 10.5px var(--sans); fill: var(--ink-2); }

.gwire.sel { stroke: var(--accent); stroke-width: 2.2; }

.port.out { fill: var(--accent); stroke: var(--accent); }
.port.ok { fill: var(--ok); } .port.no { opacity: .25; }

// ===== geom2d.js =====
//! Plane geometry: the nine closed-form primitives of spec §10.6, arcs, the
//! Curve2D family a wall centreline can be, and the path/region vocabulary the
//! 2D scene is written in.
//!
//! Lines are always `P + t·d` with a unit `d`. There is no slope-intercept form
//! anywhere in this file, so a vertical line is not special: every intersection
//! is one determinant and one `|det| < TOL` check (acceptance test 33a/33b).

const TOL = 1e-6;          // model mm — every coincidence test goes through this
// |det| of two unit directions is the sine of the angle between them. 1e-5 is
// 0.00057°: two walls 0.0001° apart are parallel, not an intersection 500m
// away (test 33b); the smallest deliberate angle a person draws is far above it.
const ANG_TOL = 1e-5;
const OFFSET_TOL = 0.5;    // mm — refit tolerance for ellipse/spline offsets (§3.2)
const MITER_LIMIT = 4;     // × offset, then bevel (§3.4)

// ---------------------------------------------------------------- vectors
const v = (x, y) => [x, y];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul = (a, k) => [a[0] * k, a[1] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
const len = a => Math.hypot(a[0], a[1]);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const perp = a => [-a[1], a[0]];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const normalise = a => { const l = len(a); return l < TOL ? [0, 0] : [a[0] / l, a[1] / l]; };
const near = (a, b, tol = TOL) => dist(a, b) <= tol;
const rot = (a, ang) => { const c = Math.cos(ang), s = Math.sin(ang); return [a[0] * c - a[1] * s, a[0] * s + a[1] * c]; };

// ---------------------------------------------------------------- lines (§10.6)

      const prev = out[out.length - 1];
      if (name === "x" && prev && (prev.t === "num" || prev.t === "unit" || (prev.t === "op" && prev.v === ")"))) out.push({ t: "op", v: "*", at: i });
      else out.push({ t: "name", v: name, at: i });
      i = j; continue;
    }
    if ("+-*/^(),&".includes(c)) { out.push({ t: "op", v: c, at: i }); i++; continue; }
    if (c === "×") { out.push({ t: "op", v: "*", at: i }); i++; continue; }
    throw new ExprError(`"${c}" is not something an expression can contain`, i);
  }
  return out;
}

// ---------------------------------------------------------------- parser
// expr   := concat
// concat := sum ('&' sum)*
// sum    := prod (('+'|'-') prod)*
// prod   := unary (('*'|'/') unary)*
// unary  := '-' unary | power
// power  := atom ('^' unary)?
// atom   := (num | name | call | '(' expr ')' | str) unit?
function parse(src) {
  const toks = tokenise(String(src));
  let k = 0;
  const peek = () => toks[k], next = () => toks[k++];
  const isOp = v => peek() && peek().t === "op" && peek().v === v;
  const expect = v => { if (!isOp(v)) throw new ExprError(`expected "${v}"`, peek() ? peek().at : src.length); next(); };
  function concat() { let n = sum(); while (isOp("&")) { next(); n = { k: "bin", op: "&", a: n, b: sum() }; } return n; }
  function sum() { let n = prod(); while (isOp("+") || isOp("-")) { const op = next().v; n = { k: "bin", op, a: n, b: prod() }; } return n; }
  function prod() {
    let n = unary();
    for (;;) {
      if (isOp("*") || isOp("/")) { const op = next().v; n = { k: "bin", op, a: n, b: unary() }; continue; }
      // implicit multiplication: "2 span", "sqrt(2) m" handled by unit; "2(3)" allowed
      if (peek() && (peek().t === "num" || (peek().t === "op" && peek().v === "("))) { n = { k: "bin", op: "*", a: n, b: unary() }; continue; }
      return n;
    }
  }
  function unary() { if (isOp("-")) { next(); return { k: "neg", a: unary() }; } if (isOp("+")) { next(); return unary(); } return power(); }
  function power() { const n = atom(); if (isOp("^")) { next(); return { k: "bin", op: "^", a: n, b: unary() }; } return n; }
  function atom() {
    const t = next();
    if (!t) throw new ExprError("the expression ends too soon", src.length);
    let n;
    if (t.t === "num") n = { k: "num", v: t.v };
    else if (t.t === "str") n = { k: "str", v: t.v };
    else if (t.t === "op" && t.v === "(") { n = concat(); expect(")"); }
    else if (t.t === "name") {
      if (isOp("(")) {
        next(); const args = [];
        if (!isOp(")")) { args.push(concat()); while (isOp(",")) { next(); args.push(concat()); } }
        expect(")"); n = { k: "call", f: t.v, args, at: t.at };
      } else n = { k: "name", v: t.v, at: t.at };
    } else throw new ExprError(`"${t.v}" cannot start a value`, t.at);
    // a trailing unit — a name that is a unit, directly after a value
    const u = peek();
    if (u && (u.t === "unit" || (u.t === "name" && UNITS[u.v]))) { next(); n = { k: "scaled", a: n, unit: u.v }; }
    return n;
  }
  const tree = concat();
  if (k < toks.length) throw new ExprError(`unexpected "${toks[k].v}"`, toks[k].at);
  return tree;
}

/** The identifiers a tree references — known before evaluating (for wiring). */
function namesIn(tree, out = new Set()) {
  if (!tree) return out;
  if (tree.k === "name") { if (!CONSTS[tree.v]) out.add(tree.v); }
  else if (tree.k === "call") tree.args.forEach(a => namesIn(a, out));
  else if (tree.k === "bin") { namesIn(tree.a, out); namesIn(tree.b, out); }
  else if (tree.k === "neg" || tree.k === "scaled") namesIn(tree.a, out);
  return [...out];
}

const CONSTS = { pi: Math.PI, PI: Math.PI, e: Math.E, true: 1, false: 0 };
const FUNCS = {
  sqrt: Math.sqrt, abs: Math.abs, min: Math.min, max: Math.max, round: Math.round, floor: Math.floor, ceil: Math.ceil,
  sin: x => Math.sin(x * Math.PI / 180), cos: x => Math.cos(x * Math.PI / 180), tan: x => Math.tan(x * Math.PI / 180),
  atan2: (y, x) => Math.atan2(y, x) * 180 / Math.PI,
};

const num = (kind, v) => ({ kind, v });
function formatValue(val, unit = DOC_UNIT) {
  if (val == null) return "";
  if (val.kind === "Text") return val.v;
  if (val.kind === "Boolean") return val.v ? "Yes" : "No";
  if (val.kind === "Length") return `${fmt(val.v / UNITS[unit].f)} ${unit}`;
  if (val.kind === "Area") return `${fmt(val.v / 1e6)} m²`;
  if (val.kind === "Angle") return `${fmt(val.v)}°`;
  return fmt(val.v);
}
const fmt = x => (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : String(Number(x.toFixed(3))));

/** Evaluate with `lookup(name) → value | undefined`. `into` is the quantity
 *  wanted: a bare number typed into a Length field is millimetres. */
function evaluate(tree, { lookup = () => undefined, into = "Number" } = {}) {
  const ev = n => {
    switch (n.k) {
      // A bare literal is dimensionless until the end: "2 * span" must stay a
      // Length, not become an area. The field's quantity is applied once, below.
      case "num": return num("Number", n.v);
      case "str": return num("Text", n.v);
      case "name": {
        if (n.v in CONSTS) return num("Number", CONSTS[n.v]);
        const got = lookup(n.v);
        if (got === undefined) throw new ExprError(`no parameter called \`${n.v}\``, n.at);
        if (got && got.error) throw new ExprError(`\`${n.v}\` has an error: ${got.error}`, n.at);
        return typeof got === "number" ? num("Number", got) : typeof got === "string" ? num("Text", got) : got;
      }
      case "neg": { const a = ev(n.a); if (a.kind === "Text") throw new ExprError("text cannot be negated"); return num(a.kind, -a.v); }
      case "scaled": {
        // the unit scales the literal it follows: 10 m is 10 000 mm, sqrt(2) m is 1414.2 mm
        const a = ev(n.a), U = UNITS[n.unit];
        return num(U.q, a.v * U.f);
      }
      case "call": {
        const f = FUNCS[n.f];
        if (!f) throw new ExprError(`there is no function called \`${n.f}\``, n.at);
        const args = n.args.map(ev);
        const r = f(...args.map(a => a.v));
        const keep = ["abs", "min", "max", "round", "floor", "ceil"].includes(n.f) ? args[0].kind : "Number";
        return num(keep, r);
      }
      case "bin": {
        const a = ev(n.a), b = ev(n.b);
        if (n.op === "&") return num("Text", formatValue(a) + formatValue(b));
        if (a.kind === "Text" || b.kind === "Text") throw new ExprError(`"${n.op}" needs numbers; use & to join text`);
        switch (n.op) {
          case "+": case "-": {
            const kind = a.kind === "Number" ? b.kind : a.kind;
            return num(kind, n.op === "+" ? a.v + b.v : a.v - b.v);
          }
          case "*": {
            const kind = a.kind === "Length" && b.kind === "Length" ? "Area" : a.kind === "Number" ? b.kind : a.kind;
            return num(kind, a.v * b.v);
          }
          case "/": {
            if (Math.abs(b.v) < 1e-300) throw new ExprError("division by zero");
            const kind = a.kind === b.kind ? "Number" : b.kind === "Number" ? a.kind : "Number";
            return num(kind, a.v / b.v);
          }
          case "^": return num("Number", Math.pow(a.v, b.v));
        }
      }
    }
    throw new ExprError("cannot evaluate this");
  };
  const out = ev(tree);
  return out;
}

/** Does this text read as an expression rather than a literal? */
function saysFormula(text) {
  const s = String(text).trim();
  if (s === "") return false;
  if (/^-?\d+(\.\d+)?$/.test(s)) return false;
  return true;
}

/** Read what a person typed into a typed field. Returns
 *  { value, expr, names } — `expr` kept for round-tripping when it is a formula. */
function readValue(text, { kind = "Length", lookup } = {}) {
  const tree = parse(text);
  const names = namesIn(tree);
  const val = evaluate(tree, { lookup, into: kind === "Integer" ? "Number" : kind });
  if ((kind === "Length" || kind === "Angle") && val.kind === "Number") val.kind = kind;
  if (kind === "Length" && val.kind !== "Length") throw new ExprError(`this field wants a length; that is ${val.kind === "Angle" ? "an angle" : "a " + val.kind.toLowerCase()}`);
  if (kind === "Angle" && val.kind !== "Angle") throw new ExprError(`this field wants an angle; that is a ${val.kind.toLowerCase()}`);
  return { value: val.v, val, expr: saysFormula(text) ? String(text).trim() : null, names };
}

// ===== ocaf.js =====
//! The document: an OCAF-style label tree with typed attributes, a catalogue
//! declared as data, drivers as pure functions, a logbook solver, and JSON
//! read/write (spec §1, §2, §13). Nothing in here knows what a wall is.
//!
//! Tree layout:
//!   0:1  elements        one label per element, tag = creation sequence
//!   0:2  definitions     types, families, materials, styles … one label each
//! Under an element label (tags are on disk; never renumber):
//!   1..9 arguments in declared order · 10–49 user parameters · 51 their specs
//!   52 appearance · 53 frame · 54 parent container
//!   100 result · 101 error · 102 revision · 103 data · 104 note · 105 plan rep · 106 elevation rep



const FIRST_ARG_TAG = 1;
const RESULT_TAG = 100;
const ERROR_TAG = 101;
const REVISION_TAG = 102;
const DATA_TAG = 103;
const NOTE_TAG = 104;
const PLAN_TAG = 105;          // the 2D plan derivation (v0.2)
const ELEV_TAG = 106;          // the 2D elevation derivation (v0.2)
const PARAM_TAG0 = 10;
const PARAM_TAG_END = 49;
const PARAM_SPEC_TAG = 51;
const APPEARANCE_TAG = 52;
const FRAME_TAG = 53;
const PARENT_TAG = 54;
const MAX_ARGS = PARAM_TAG0 - FIRST_ARG_TAG;   // 9: tag 10 is where parameters start

// ---------------------------------------------------------------- labels
class Label {
  constructor(tag, parent = null) { this.tag = tag; this.parent = parent; this.attrs = Object.create(null); this.kids = new Map(); }
  child(tag, create = true) {
    let c = this.kids.get(tag);
    if (!c && create) { c = new Label(tag, this); this.kids.set(tag, c); }
    return c || null;
  }
  get(attr) { return this.attrs[attr]; }
  set(attr, v) { if (v === undefined) delete this.attrs[attr]; else this.attrs[attr] = v; return this; }
  /** "0:1:12:4" — shown under every panel field so bug reports are precise. */
  entry() { const t = []; for (let l = this; l; l = l.parent) t.unshift(l.tag); return t.join(":"); }
  forget(tag) { this.kids.delete(tag); }
}

// ---------------------------------------------------------------- catalogue helpers
//! One `args` entry drives the property panel, the node editor's ports, the
//! graph's wiring validation and the save format. Four consumers, one declaration.
const argOf = (kind, key, label, extra, opts = {}) => Object.assign({ kind, key, label, group: "Constraints" }, extra, opts);
const real = (key, label, def, min, max, step, unit = "mm", opts = {}) =>
  argOf("Real", key, label, { def, min, max, step, unit, quantity: unit === "mm" ? "Length" : unit === "°" ? "Angle" : "Number" }, opts);
const integer = (key, label, def, min, max, opts = {}) => argOf("Integer", key, label, { def, min, max, quantity: "Integer" }, opts);
const bool = (key, label, def = false, opts = {}) => argOf("Boolean", key, label, { def }, opts);
const text = (key, label, def = "", opts = {}) => argOf("Text", key, label, { def }, opts);
const choice = (key, label, options, defIndex = 0, opts = {}) => argOf("Choice", key, label, { options, def: options[defIndex] }, opts);
/** A reference. `kinds` drive what the panel offers and what a wire may connect.
 *  `view: true` marks an annotation/appearance link that must NOT enter the model graph (§1.4). */
const ref = (key, label, kinds, opts = {}) => argOf("Reference", key, label, { kinds, def: null }, opts);
const curve2d = (key, label, types, def, opts = {}) => argOf("Curve2D", key, label, { types, def }, opts);
const point2d = (key, label, def = [0, 0], opts = {}) => argOf("Point2D", key, label, { def }, opts);
const json = (key, label, def, opts = {}) => argOf("Json", key, label, { def }, opts);
const when = (arg, key, value) => Object.assign({}, arg, { when: { key, value } });

/** Geometric driver arguments: never attributes, never a text box (§4.1, §4.5). */
const GEOMETRIC_KINDS = new Set(["Curve2D", "Point2D", "Json"]);
/** The closed attribute kind set (§4.1). A parameter spec outside it is refused at load. */
const ATTRIBUTE_KINDS = ["Length", "Angle", "Number", "Integer", "Boolean", "Text", "MultiText", "Enum", "Colour", "URL",
  "Material", "Symbol", "WallType", "DoorType", "WindowType", "ColumnType", "Level", "Phase", "Host", "Space"];

const CATALOGUE = new Map();   // type → declaration
const BUILDERS = Object.create(null);
function declare(entry) {
  if (entry.args.length > MAX_ARGS) throw new Error(`${entry.type} declares ${entry.args.length} arguments; tags ${FIRST_ARG_TAG}–${MAX_ARGS} are all there is before the parameter range`);
  CATALOGUE.set(entry.type, entry);
  return entry;
}

// ---------------------------------------------------------------- logbook
class Logbook {
  constructor() { this.touched = new Set(); this.impacted = new Set(); }
  touch(label) { this.touched.add(label); }
  impact(label) { this.impacted.add(label); }
  isModified(label) { return this.touched.has(label) || this.impacted.has(label); }
  clear() { this.touched.clear(); this.impacted.clear(); }
  get empty() { return this.touched.size === 0 && this.impacted.size === 0; }
}

/** Libraries that drive geometry (edits bump the model revision) versus
 *  libraries that only drive drawing (edits bump the view revision) — §1.4. */
const MODEL_LIBS = ["families", "types"];
const VIEW_LIBS = ["categories", "paramSpecs", "patterns", "materials", "symbols", "viewStyles", "pens", "textTypes"];
const LIB_ORDER = ["categories", "paramSpecs", "pens", "patterns", "materials", "symbols", "families", "types", "textTypes", "viewStyles"];

// ---------------------------------------------------------------- the document
class Document {
  constructor() {
    this.root = new Label(0);
    this.elementsLabel = this.root.child(1);
    this.defsLabel = this.root.child(2);
    this.byId = new Map();          // stable id → element label
    this.defs = new Map();          // "types:T-EXTCAV300" → definition label
    this.lib = {}; for (const k of LIB_ORDER) this.lib[k] = {};
    this.joins = []; this.constraints = [];
    this.graph = { layout: {} }; this.browser = {};
    this.meta = { format: "web-bim-document", version: 1, units: "mm", name: "Untitled" };
    this.log = new Logbook();
    this.modelRevision = 0; this.viewRevision = 0; this.relationRevision = 0;
    this.nextTag = 1; this.nextDefTag = 1;
    this.stats = newStats();
    this.systemPasses = [];          // phase 3: (doc, rebuilt:Set<Label>) => void
    this.loadReport = [];
    this.extra = {};                 // unknown top-level keys, written back untouched
  }

  // -------- elements
  elements() { return [...this.elementsLabel.kids.values()]; }
  element(id) { return this.byId.get(id) || null; }
  idOf(f) { return f.get("AsciiString"); }
  typeOf(f) { return f.get("Type"); }
  declOf(f) { return CATALOGUE.get(f.get("Type")) || null; }

  /** Create an element label from its JSON record. References stay as ids
   *  until `wire()` — forward references are normal (§2.3). */
  addElement(rec, { touch = true } = {}) {
    const decl = CATALOGUE.get(rec.type);
    let id = rec.id;
    if (!id) id = this.freshId(rec.type);
    if (this.byId.has(id)) throw new Error(`an element called ${id} already exists`);
    const f = this.elementsLabel.child(this.nextTag++);
    f.set("AsciiString", id).set("Type", rec.type).set("Name", rec.name || id)
     .set("Integer", rec.visible === false ? 0 : 1);
    if (!decl) {
      f.set("Placeholder", rec.raw || rec).set("Function", null);
      f.child(ERROR_TAG).set("Text", `unknown element type "${rec.type}" — kept as it was read so a save does not lose it`);
      this.byId.set(id, f);
      return f;
    }
    f.set("Function", decl.guid);
    const args = rec.args || {};
    decl.args.forEach((a, i) => {
      const lab = f.child(FIRST_ARG_TAG + i);
      lab.set("Key", a.key).set("Kind", a.kind);
      lab.set("Value", args[a.key] !== undefined ? clone(args[a.key]) : clone(a.def));
    });
    // Arguments this build does not know (a newer file) survive a save.
    const known = new Set(decl.args.map(a => a.key));
    const unknown = Object.keys(args).filter(k => !known.has(k));
    if (unknown.length) f.set("ExtraArgs", Object.fromEntries(unknown.map(k => [k, args[k]])));
    if (rec.params) Object.entries(rec.params).forEach(([k, v]) => this.setParam(f, k, v, false));
    if (rec.parent) f.child(PARENT_TAG).set("Reference", rec.parent);
    if (rec.appearance) f.child(APPEARANCE_TAG).set("Json", clone(rec.appearance));
    if (rec.overrides) f.child(APPEARANCE_TAG).set("Overrides", clone(rec.overrides));
    this.byId.set(id, f);
    if (touch) this.log.touch(f);
    return f;
  }
  freshId(type) {
    const base = (CATALOGUE.get(type) && CATALOGUE.get(type).idPrefix) || type.slice(0, 2).toUpperCase();
    let n = 1; while (this.byId.has(base + n)) n++;
    return base + n;
  }
  removeElement(id) {
    const f = this.byId.get(id); if (!f) return false;
    this.elementsLabel.forget(f.tag); this.byId.delete(id);
    // Deleting is local: relationship rows go with it; no element held a pointer (§1.5).
    const before = this.joins.length + this.constraints.length;
    this.joins = this.joins.filter(j => j.a.of !== id && j.b.of !== id);
    this.constraints = this.constraints.filter(c => !c.of.some(r => r.split(":")[0] === id));
    if (this.joins.length + this.constraints.length !== before) this.relationRevision++;
    // Whoever referenced it must rebuild and will say what went missing.
    for (const g of this.elements()) if (this.argumentIds(g).includes(id)) this.log.touch(g);
    return true;
  }

  // -------- arguments
  argLabel(f, key) {
    const decl = this.declOf(f); if (!decl) return null;
    const i = decl.args.findIndex(a => a.key === key);
    return i < 0 ? null : f.child(FIRST_ARG_TAG + i, false);
  }
  argValue(f, key) { const l = this.argLabel(f, key); return l ? l.get("Value") : undefined; }
  setArg(f, key, value) {
    const l = this.argLabel(f, key);
    if (!l) throw new Error(`${this.idOf(f)} has no argument called "${key}"`);
    l.set("Value", clone(value));
    this.log.touch(l); this.log.touch(f);
  }

  // -------- user parameters (tags 10–49)
  paramLabels(f) { const out = []; for (let t = PARAM_TAG0; t <= PARAM_TAG_END; t++) { const l = f.child(t, false); if (l) out.push(l); } return out; }
  getParam(f, name) { const l = this.paramLabels(f).find(l => l.get("Name") === name); return l ? l.get("Value") : undefined; }
  setParam(f, name, value, touchView = true) {
    let l = this.paramLabels(f).find(l => l.get("Name") === name);
    if (!l) {
      let t = PARAM_TAG0; while (f.child(t, false)) t++;
      if (t > PARAM_TAG_END) throw new Error(`${this.idOf(f)} already carries ${PARAM_TAG_END - PARAM_TAG0 + 1} parameters`);
      l = f.child(t).set("Name", name);
    }
    if (value === undefined) { f.forget(l.tag); } else l.set("Value", clone(value));
    // Parameters drive filters and tags, not geometry: a view change (§1.4).
    if (touchView) this.viewRevision++;
  }
  params(f) { const o = {}; for (const l of this.paramLabels(f)) o[l.get("Name")] = l.get("Value"); return o; }

  // -------- references and the graph
  /** Element ids a label's arguments depend on. View-side refs and the parent
   *  are deliberately not here (§1.4): a folder, a tag or a line weight must not
   *  order the graph. Bound numeric fields ({ref}) are dependencies. */
  argumentIds(f) {
    const decl = this.declOf(f); if (!decl) return [];
    const out = [];
    decl.args.forEach((a, i) => {
      if (a.view) return;
      const v = f.child(FIRST_ARG_TAG + i, false)?.get("Value");
      collectRefs(v, out);
    });
    const extra = decl.dependsOn ? decl.dependsOn(f, this) : [];
    return out.concat(extra).filter(id => this.byId.has(id));
  }
  /** Definition labels (types/families) an element's arguments read. */
  argumentDefs(f) {
    const decl = this.declOf(f); if (!decl) return [];
    const out = [];
    decl.args.forEach((a, i) => {
      if (a.kind !== "Reference" || a.view) return;
      const v = f.child(FIRST_ARG_TAG + i, false)?.get("Value");
      const id = v && v.ref;
      for (const lib of MODEL_LIBS) if (this.lib[lib][id]) out.push(this.defLabel(lib, id));
    });
    return out;
  }
  dependents(id) { return this.elements().filter(g => this.argumentIds(g).includes(id)).map(g => this.idOf(g)); }

  /** Dependency order. A cycle is refused by naming it, not by looping. */
  topoOrder() {
    const els = this.elements(), state = new Map(), order = [], cycles = [];
    const visit = (f, stack) => {
      const s = state.get(f);
      if (s === 2) return; if (s === 1) { cycles.push(stack.map(x => this.idOf(x)).concat(this.idOf(f))); return; }
      state.set(f, 1);
      for (const id of this.argumentIds(f)) visit(this.byId.get(id), stack.concat(f));
      state.set(f, 2); order.push(f);
    };
    for (const f of els) visit(f, []);
    return { order, cycles };
  }

  // -------- definitions (types, families, materials, styles …)
  defLabel(lib, id) {
    const k = lib + ":" + id;
    let l = this.defs.get(k);
    if (!l) { l = this.defsLabel.child(this.nextDefTag++).set("AsciiString", k); this.defs.set(k, l); }
    return l;
  }
  setDef(lib, id, data) {
    if (data === undefined) delete this.lib[lib][id]; else this.lib[lib][id] = clone(data);
    if (MODEL_LIBS.includes(lib)) {
      this.log.touch(this.defLabel(lib, id));
      // A family edit reaches every type below it, however deep (§5).
      if (lib === "families") for (const [tid, t] of Object.entries(this.lib.types)) if (this.familyChain(t.family).some(fam => fam.id === id)) this.log.touch(this.defLabel("types", tid));
    } else this.viewRevision++;
  }
  /** The extends chain, root last. Cycles are refused at load (§5). */
  familyChain(famId) {
    const out = [], seen = new Set();
    for (let id = famId; id; ) {
      if (seen.has(id)) throw new Error(`family ${id} extends itself through ${[...seen].join(" → ")}`);
      seen.add(id);
      const fam = this.lib.families[id]; if (!fam) break;
      out.push(Object.assign({ id }, fam)); id = fam.extends;
    }
    return out;
  }
  /** A type with its family chain resolved: child overrides parent. Each value
   *  says where it came from, which the panel shows (§5). */

// ---------------------------------------------------------------- 3D pieces

// ===== spaces.js =====
//! Planar face-finding (spec §3.6): turn a soup of straight segments into the
//! bounded faces of their planar subdivision, then give each face to the space
//! whose anchor lies in it.

//! Pipeline: split at every intersection (grid-indexed) → weld within tol
//! (union-find over a grid, not rounded keys, so two points 0.4 mm apart on
//! either side of a rounding boundary still merge) → drop zero-length and

// ---------------------------------------------------------------- step 1: split
/** Split parameters for every segment against every nearby segment. */

// ---------------------------------------------------------------- step 2: weld

// ---------------------------------------------------------------- inside tests

    const fitted = ends.find(x => !boundaryGeom(x.w, 0));
    if (fitted) { ends.forEach(x => say(x.id, `joins on a ${fitted.w.curve.type} centreline are drawn as free ends`)); continue; }

  // End-on-middle rows are T joins: the through wall is never split (§10.9).
  for (const j of rows) {
    if (j.b.end || j.allowed === false || j.kind === "square") continue;
    const A = walls.get(j.a.of), B = walls.get(j.b.of);
    if (!A || !B) continue;

function resolveNode(ends, row, say) {
  const P = ends.map(x => x.p).reduce((a, b) => add(a, b)).map(v => v / ends.length);

    const t = x.e === "start" ? 0 : 1;
    const tan = x.w.curve.tangentAt(t);
    x.dir = x.e === "start" ? tan : mul(tan, -1);         // pointing from the node into the wall
    const sMax = Math.max(...x.w.stack.s), sMin = Math.min(...x.w.stack.s);
    // Faces relative to x.dir: left of dir is +s at a start, −s at an end.
    const lineAt = s => ({ p: add(x.p, mul(x.w.curve.normalAt(t), s)), d: tan });
    x.left = x.e === "start" ? lineAt(sMax) : lineAt(sMin);
    x.right = x.e === "start" ? lineAt(sMin) : lineAt(sMax);

      const Bl = projectPoint(E.left, P), Br = projectPoint(G.right, P);

// ---------------------------------------------------------------- spans per detail level
/** Terminators for a wall end at a given detail level. T ends are the only

/** Gaps in a through wall where incoming walls pass (Fine only), and openings. */

/** The drawing of a wall at a detail level and cut height: closed layer regions

/** layerRegion, with "wall" terminators resolved through termAt. */

// ===== dxf.js =====
//! DXF exchange (spec §12). Writes AutoCAD 2000 (AC1015) ASCII DXF — the oldest
//! version that honours group 370 (per-entity lineweight in 1/100 mm) and 420
//! (true colour) — and reads the common 2D entity set back into the app's path
//! format. Units are decided exactly once: the reader converts every coordinate
//! to millimetres in a single pass at the end (dxScaleAll), so an inch file can
//! never be multiplied by 25.4 twice. `makeZip` exists because the host page may
//! only download .zip, so a .dxf is shipped inside a STORE-method archive.



// ---------------------------------------------------------------- lineweights (§12.4)

/** The only lineweights DXF can carry (group 370, hundredths of a millimetre). */
const DXF_LWEIGHTS = [0, 5, 9, 13, 15, 18, 20, 25, 30, 35, 40, 50, 53, 60, 70, 80, 90, 100, 106, 120, 140, 158, 200, 211];

/** Snap a pen width in mm to the nearest legal rung. Ties go to the heavier rung
 *  (a line should never print thinner than drawn). `substituted` is true when the
 *  rung differs from the request by more than float noise (0.18*100 = 18.000000000000004). */

    if (d < bd - 1e-9 || (Math.abs(d - bd) <= 1e-9 && w > best)) { bd = d; best = w; }
  }
  return { code: best, substituted: Math.abs(best - want) > 1e-6, from: mm, to: best / 100 };
}

// ---------------------------------------------------------------- shared tables

// $INSUNITS code ↔ unit name ↔ millimetres per unit.
const dxUnitCodes = { 1: ["in", 25.4], 2: ["ft", 304.8], 3: ["mi", 1609344], 4: ["mm", 1], 5: ["cm", 10], 6: ["m", 1000],

function dxSubpaths(path) {

// ---------------------------------------------------------------- writer

/** Scene → AC1015 DXF text plus a human-readable report of every compromise. */
function writeDXF(scene, { units = "mm", space = "model", name = "" } = {}) {

function sectionArea(w, h, stats) {
  let A = 0;
  for (const pc of w.pieces) {
    const S = wallSurfaces(w, w.stack.s[0], w.stack.s[w.stack.s.length - 1], plane([...perpv(sub(pc.foot[3], pc.foot[0])).map(x => -x), 0], [...pc.foot[0], 0]), plane([...perpv(sub(pc.foot[2], pc.foot[1])), 0], [...pc.foot[1], 0]));
    A += Math.abs(polyArea(cutAtHeight(S, h, stats)));
  }
  return A;
}

async function exportDXF() {
  const doc = app.doc, v = app.activeView && doc.element(app.activeView);
  if (!v || !["PlanView", "ElevationView", "Sheet"].includes(doc.typeOf(v))) return app.say("open a plan, elevation or sheet to export it as DXF", "note");
  const sc = deriveView(doc, v), sheet = doc.typeOf(v) === "Sheet";
  const S = sheet ? 1 : (F.int(v, "scale") || 100);
  const flat = []; const walk = ps => { for (const p of ps) { if (p.t === "group") walk(p.prims); else flat.push(p); } };
  walk(sc.prims);
  // model space at full size: undo the view scale for geometry, keep weights and text as paper values
  const k = sheet ? 1 : S;
  const T = q => [q[0] * k, q[1] * k];
  const prims = flat.filter(p => p.t !== "raster").map(p => {
    const q = Object.assign({}, p);
    if (p.path) q.path = p.path.map(s => s.k === "L" ? { k: "L", a: T(s.a), b: T(s.b) } : s.k === "A" ? Object.assign({}, s, { c: T(s.c), r: s.r * k }) : { k: "C", a: T(s.a), c1: T(s.c1), c2: T(s.c2), b: T(s.b) });
    if (p.at) q.at = T(p.at);
    if (p.t === "text") q.height = p.height * k;
    if (p.t === "hatch") q.scale = p.scale * k;
    return q;
  });
  const out = writeDXF({ prims }, { units: "mm", space: sheet ? "paper" : "model", name: v.get("Name") });
  const zip = makeZip([{ name: `${v.get("Name").replace(/[^\w\- ]+/g, "")}.dxf`, data: out.text }]);
  const r = await saveFile(`${v.get("Name").replace(/[^\w\- ]+/g, "")}-dxf.zip`, zip, "application/zip");
  app.say(r.ok ? `DXF (${sheet ? "paper space 1:1" : "model space, full size"}), ${prims.length} entities${out.report.length ? " — " + out.report.join("; ") : ""}` : r.error, r.ok ? "ok" : "error");
}

// ---------------------------------------------------------------- diagnostics
function renderDiagnostics(main) {
  const pane = h("div", { class: "sheetpane" }), card = h("div", { class: "doccard" });
  const doc = app.doc, s = doc.stats;
  const summary = h("div", { class: "summary" });
  const list = h("div", { class: "results" });
  const run = () => {
    clear(summary); clear(list);
    const t0 = performance.now(); const res = runAll(); const ms = performance.now() - t0;
    const pass = res.filter(r => r.pass).length, gaps = res.filter(r => r.gap).length, fail = res.length - pass - gaps;
    summary.append(stat(pass, "passed"), stat(fail, "failed"), stat(gaps, "declared gaps"), stat(`${ms.toFixed(0)} ms`, "suite time"));
    for (const r of res.sort((a, b) => (a.pass === b.pass ? 0 : a.pass ? 1 : -1))) list.append(h("div", { class: "result " + (r.gap ? "gap" : r.pass ? "pass" : "fail") },
      h("div", { class: "st" }, r.gap ? "GAP" : r.pass ? "PASS" : "FAIL"),
      h("div", {}, h("div", { class: "nm" }, `${r.id} · ${r.name}`), h("div", { class: "kv" }, h("span", {}, "expected"), h("span", {}, String(r.expected)), h("span", {}, "measured"), h("span", {}, String(r.got)), r.note ? h("span", {}, "note") : null, r.note ? h("span", {}, r.note) : null))));
  };
  const stat = (b, l) => h("div", { class: "stat" }, h("b", {}, b), h("span", {}, l));
  card.append(h("header", {}, h("h2", {}, "Diagnostics"), h("span", { class: "muted" }, `§15 acceptance tests — every expected value derived by hand first. ${CASES.length} cases; the same suite runs under node --test.`), h("button", { class: "btn small primary", onclick: run }, "Run again")),
    h("div", { style: { padding: "10px 18px", overflowWrap: "anywhere" }, class: "mono muted" }, `This document: builds ${JSON.stringify(s.builds)} · offsets ${s.offsets} · fused cuts ${s.cuts} · derives ${s.derives} · fast path ${s.fastPath} · surface path ${s.surfacePath}`),
    ...(doc.loadReport.length ? [h("div", { class: "banner note" }, "Load report: " + doc.loadReport.join("; "))] : []),
    summary, list);
  pane.append(card); main.append(pane);
  setTimeout(run, 30);
}


// ---------------------------------------------------------------- keys (Revit two-letter shortcuts)
const SHORTCUTS = Object.fromEntries(Object.entries(COMMANDS).filter(([, c]) => c.key).map(([id, c]) => [c.key.toUpperCase(), id]));
let keyBuf = "", keyTimer = null;
window.addEventListener("keydown", e => {
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); app.run(e.shiftKey ? "redo" : "undo"); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); app.run("redo"); return; }
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); app.run("save"); return; }
  if (e.key === "Escape") {
    keyBuf = ""; if (openMenu) { closeMenus(); return; }
    if (app.pickMode) { app.endPick(); return; }
    if (app.tool !== "select") { app.setTool("select"); return; }
    if (app.selection.size) app.select([]); return;
  }
  if ((e.key === "Delete" || e.key === "Backspace") && app.selection.size && app.activeView !== "__graph") { e.preventDefault(); deleteSelection(); return; }
  if (mod || e.altKey) return;
  if (e.key === "Enter" && !keyBuf && app.lastCommand && app.tool === "select") { app.run(app.lastCommand); return; }
  if (!/^[a-z0-9]$/i.test(e.key)) return;
  keyBuf = (keyBuf + e.key.toUpperCase()).slice(-2);
  clearTimeout(keyTimer); keyTimer = setTimeout(() => { keyBuf = ""; const s = document.getElementById("stats"); if (s) s.dataset.keys = ""; }, 1200);
  const m = document.getElementById("stats"); if (m) m.dataset.keys = keyBuf;
  if (keyBuf.length === 2 && SHORTCUTS[keyBuf]) { const id = SHORTCUTS[keyBuf]; keyBuf = ""; if (m) m.dataset.keys = ""; e.preventDefault(); app.run(id); return; }
  if (keyBuf.length === 1 && e.key.toLowerCase() === "f" && !Object.keys(SHORTCUTS).some(k => k[0] === "F")) { keyBuf = ""; app.run("zoomfit"); }
});
// typing a value into Properties while "pick to bind" is waiting means you meant the value: stop picking
document.addEventListener("focusin", e => { if (app.pickMode && e.target.closest && e.target.closest("#left") && e.target.tagName === "INPUT") { app.pickMode = null; app.say("Pick cancelled: type the value and press Enter", "note"); renderOptionsBar(); } });
document.addEventListener("pointerdown", e => { if (openMenu && !openMenu.contains(e.target)) closeMenus(); }, true);
window.addEventListener("resize", () => { const v = app.views.get(app.activeView); if (v && v.resize) v.resize(); });

// ---------------------------------------------------------------- boot
async function boot() {
  const snaps = store("snaps"); if (snaps) Object.assign(app.snaps, snaps);
  const split = store("split"); if (split) document.getElementById("left").style.setProperty("--split", (split * 100).toFixed(1) + "%");
  await loadDrawingFont();
  let doc = null, note = null;
  const draft = store("draft-v2");
  if (draft) { try { doc = openDocument(draft); doc.regenerate(); note = { msg: "Restored your draft from this browser. File › New to start empty.", kind: "note" }; } catch (e) { doc = null; } }
  if (!doc) doc = buildSample();
  setDocument(doc, note || { msg: `Studio House: ${doc.elements().length} elements. Double-click a view in the Project Browser to open it; WA draws walls; 3D opens the {3D} view.`, kind: "ok" });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

})();
</script>
