# Publishes the Diagram Compositor (web/nukestyle_diagram_editor) to GitHub Pages, so it runs
# from its own address: there it can call outside services such as Gemini, which the claude.ai
# artifact viewer's security policy refuses.
name: Deploy compositor to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/nukestyle_diagram_editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/nukestyle_diagram_editor
      - id: deployment
        uses: actions/deploy-pages@v4
